<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>

<body>

  <!-- Header: VML Logo + App Name -->
  <div class="header">
    <img src="../assets/logo-vml.png" alt="VML" class="header-logo">
    <div class="header-info">
      <h1 class="header-title">VML AEM 360 Tool</h1>
      <p class="header-version" id="appVersion">v1.0 - Initializing</p>
    </div>
  </div>

  <div class="main-container premium-glass">
    <!-- Module: Asset Injector -->
    <div class="tool-section tab-content active" id="sectionAssetInjector">
      <div class="tool-header">
        <div class="tool-header-left">
          <div class="module-icon module-icon--injector">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
          </div>
          <div class="module-header-info">
            <div class="module-title-row">
              <h3 class="module-title">Asset Injector</h3>
              <button class="info-btn" data-module="assetInjector" type="button" aria-label="Show info">i</button>
            </div>
            <p class="module-desc">Inject files and folders directly into AEM.</p>
          </div>
        </div>
      </div>

      <div class="tool-body">
        <div class="field-group">
          <label class="field-label">AEM BASE PATH:</label>
          <input type="text" id="aem-base-path" class="premium-input" placeholder="/content/dam/my-project">
          
          <button id="btn-activate-dropzone" class="premium-btn">ACTIVATE DROPZONE IN AEM</button>
        </div>
        <p id="aem-status" class="autofill-status"></p>
      </div>
    </div>
  </div>

  <!-- Footer: VML Branding -->
  <div class="footer">
    <img src="../assets/logo-vml.png" alt="VML" class="footer-logo">
    <div class="footer-info">
      <span class="footer-label">DEVELOPED BY:</span>
      <strong class="footer-brand">VML ARGENTINA - AUTOMATION SQUAD</strong>
    </div>
  </div>

  <!-- Modular scripts -->
  <script src="modules-info.js"></script>
  <script src="popup-ui.js"></script>
  
  <!-- Custom Modal Overlay -->
  <div id="vmlModal" class="vml-modal-overlay" style="display: none;">
    <div class="vml-modal-content">
      <div class="vml-modal-header">
        <h3 id="vmlModalTitle" class="vml-modal-title">Review Required</h3>
        <button id="vmlModalClose" class="vml-modal-close">&times;</button>
      </div>
      <div class="vml-modal-body">
        <p id="vmlModalText"></p>
        <ul id="vmlModalList" class="vml-modal-list"></ul>
      </div>
      <div class="vml-modal-footer">
        <button id="vmlModalOkBtn" class="btn-search" style="width:100%;">OK</button>
      </div>
    </div>
  </div>

  <script src="../modules/asset-injector/popup-asset-injector.js"></script>
</body>

</html>
